<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI untuk UMKM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Asisten AI untuk UMKM</h1>
        <p>Asisten untuk membantu UMKM dalam mengelola bisnis mereka</p>
        <img src="image.png" alt="Aii" width="700">
    </header>
    <nav>
        <a href="#profile">Profile</a>
        <a href="#form">Form</a>
    </nav>
    <section id="profile">
        <h2>Welcome to Asisten AI untuk UMKM</h2>
        <p>Pembanding produk UMKM dengan pesaing</p>
    </section>
    <form id="form">
        <label for="Nama">Masukan Nama Anda </label>
        <input type="text" id="Nama" name="Nama">
        <fieldset id="jenis kelammin">
            <legend>Jenis Kelamin</legend>
            <input type="radio" name="jenis_kelamin" id="pria" value="pria">
            <label for="pria">Pria</label>
            <input type="radio" name="jenis_kelamin" id="wanita" value="wanita">
            <label for="wanita">Wanita</label>
        </fieldset>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
